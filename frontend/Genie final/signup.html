<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Sign Up — StudyGenie</title>
  <link rel="stylesheet" href="css/style.css">
  <script>(function () {try {var t = localStorage.getItem("studygenieTheme") || "dark"; document.documentElement.dataset.theme = t;} catch (e) {document.documentElement.dataset.theme = "light";} })();</script>
</head>

<body class="auth-page">
  <div class="bg-grid"></div>
  <div class="glow glow-a"></div>
  <div class="auth-wrap"><a class="brand auth-brand" href="index.html"><span class="spark">✦</span> StudyGenie</a>
    <form class="auth-card" id="signupForm">
      <h2>Create your account</h2>
      <p>Start your StudyGenie learning workspace.</p><label>Full name<input id="name" required
          placeholder="Your name"></label><label>Email<input id="identifier" required
          placeholder="Email"></label><label>Password<input type="password" id="password" required
          placeholder="Create a password"></label><button class="primary-btn full" type="submit">Create account
        <span>→</span></button>
      <div class="divider"><span>or</span></div><button type="button" class="google-btn full" id="googleSignup"><b>G</b>
        Continue with Google</button>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </div>
  <script src="js/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
